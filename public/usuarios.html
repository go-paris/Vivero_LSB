<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Usuarios — Vivero Lemú</title>
  <style>
    :root{--forest:#173f34;--teal:#25aaa7;--line:#dbe4e1;--muted:#65736f;--danger:#a33;--bg:#f5f7f6}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#1e2c28}
    header{background:var(--forest);color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}
    header a{color:#fff;text-decoration:none}.wrap{width:min(1100px,92%);margin:28px auto}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
    h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{font-size:12px;font-weight:bold;color:var(--muted)}
    input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin-top:5px}button{border:0;border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:bold}.primary{background:var(--teal);color:#fff}.secondary{background:#edf3f1;color:var(--forest)}.danger{background:#fff0f0;color:var(--danger)}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);font-size:13px}.actions{display:flex;gap:6px;flex-wrap:wrap}.status{font-size:12px;padding:3px 7px;border-radius:99px;background:#e7f6ef}.inactive{background:#eee;color:#666}.notice{min-height:20px;color:var(--danger);margin:10px 0}@media(max-width:720px){.grid{grid-template-columns:1fr}.table-wrap{overflow:auto}}
  </style>
</head>
<body>
<script src="/security.js"></script>
<header><strong>Vivero Provincial Lemú · Administración de usuarios</strong><a href="/index.html">← Volver</a></header>
<main class="wrap">
  <section class="card">
    <h1>Usuarios</h1>
    <p>Las claves temporales no se almacenan ni vuelven a mostrarse. Cada persona deberá cambiarla al ingresar.</p>
    <form id="createForm">
      <div class="grid">
        <label>Nombre<input id="nombre" required maxlength="120"></label>
        <label>Usuario<input id="email" required type="text" maxlength="190" placeholder="nombre.apellido"></label>
        <label>Rol<select id="rol"><option value="usuario">Usuario normal</option></select></label>
        <label>Clave temporal<input id="password" required type="password" minlength="12" autocomplete="new-password"></label>
        <label style="grid-column:1/-1">Motivo del alta<input id="motivo" required minlength="5" maxlength="500" value="Alta para operación del Vivero Lemú"></label>
      </div>
      <p class="notice" id="notice"></p>
      <button class="primary" type="submit">Crear usuario</button>
    </form>
  </section>
  <section class="card">
    <h2>Personas habilitadas</h2>
    <div class="table-wrap"><table><thead><tr><th>Persona</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
</main>
<script>
let currentUser=null;
const notice=document.getElementById('notice');
function esc(value){const d=document.createElement('div');d.textContent=value??'';return d.innerHTML}
async function request(url,options={}){const response=await fetch(url,{credentials:'include',...options});const data=await response.json();if(!response.ok)throw new Error(data.error||'Operación rechazada');return data}
async function init(){
  const response=await fetch('/api/auth/me',{credentials:'include'});if(!response.ok){location.replace('/login.html');return}
  currentUser=await response.json();window.setCsrfToken(currentUser.csrf_token);
  if(!['director_general','administrador_tecnico'].includes(currentUser.rol)){location.replace('/index.html');return}
  if(currentUser.rol==='director_general')document.getElementById('rol').insertAdjacentHTML('beforeend','<option value="administrador_tecnico">Administrador técnico</option>');
  await loadUsers();
}
async function loadUsers(){const users=await request('/api/usuarios');document.getElementById('rows').innerHTML=users.map(u=>`<tr><td><strong>${esc(u.nombre)}</strong><br><small>${esc(u.email)}</small></td><td>${esc(u.rol)}</td><td><span class="status ${u.activo?'':'inactive'}">${u.activo?'Activo':'Inactivo'}</span>${u.bloqueado_hasta?'<br><small>Bloqueado</small>':''}</td><td><div class="actions"><button class="secondary" onclick="temporaryPassword(${u.id})">Clave temporal</button><button class="secondary" onclick="unlock(${u.id})">Desbloquear</button><button class="${u.activo?'danger':'secondary'}" onclick="toggleActive(${u.id},${u.activo?0:1})">${u.activo?'Desactivar':'Activar'}</button></div></td></tr>`).join('')}
document.getElementById('createForm').addEventListener('submit',async event=>{event.preventDefault();notice.textContent='';try{await request('/api/usuarios',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre:nombre.value,email:email.value,rol:rol.value,password_temporal:password.value,motivo:motivo.value})});event.target.reset();motivo.value='Alta para operación del Vivero Lemú';await loadUsers()}catch(error){notice.textContent=error.message}});
async function temporaryPassword(id){const password=prompt('Ingresá una clave temporal de al menos 12 caracteres. No se mostrará nuevamente.');if(!password)return;const motivo=prompt('Motivo del restablecimiento:');if(!motivo)return;try{await request(`/api/usuarios/${id}/clave-temporal`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password_temporal:password,motivo})});alert('Clave temporal asignada. Entregala por un canal seguro.')}catch(error){alert(error.message)}}
async function unlock(id){const motivo=prompt('Motivo del desbloqueo:');if(!motivo)return;try{await request(`/api/usuarios/${id}/desbloquear`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({motivo})});await loadUsers()}catch(error){alert(error.message)}}
async function toggleActive(id,activo){const motivo=prompt(`Motivo para ${activo?'activar':'desactivar'}: `);if(!motivo)return;try{await request(`/api/usuarios/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({activo:!!activo,motivo})});await loadUsers()}catch(error){alert(error.message)}}
init().catch(error=>{notice.textContent=error.message});
</script>
</body>
</html>
