<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cambiar contraseña — Vivero LEMU</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
<style>
  :root{
    --bosque:#1C3A2E;--bosque-d:#0d1f18;
    --teal:#3AAFA9;--teal-d:#1D7A76;
    --naranja:#E8722A;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Poppins',sans-serif;min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse 70% 60% at 80% 15%, rgba(232,114,42,.10) 0%, transparent 60%),
               radial-gradient(ellipse 60% 70% at 10% 90%, rgba(58,175,169,.14) 0%, transparent 60%),
               #0d1f18;
    -webkit-font-smoothing:antialiased;
    padding:20px;
  }
  .card{
    width:100%;max-width:420px;background:#fff;border-radius:16px;
    padding:40px 36px;box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .icono{
    width:52px;height:52px;border-radius:12px;
    background:linear-gradient(135deg,var(--bosque),var(--teal));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:1.3rem;margin-bottom:18px;
  }
  h1{font-size:1.3rem;font-weight:600;color:#111827;margin-bottom:6px}
  .sub{font-size:.82rem;color:#6b7280;margin-bottom:26px;line-height:1.5}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:.72rem;font-weight:600;color:#374151;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
  .field input{
    width:100%;padding:11px 14px;border:1.5px solid #e5e7eb;border-radius:10px;
    font-size:.9rem;font-family:'Poppins',sans-serif;color:#111827;outline:none;
    transition:border-color .18s,box-shadow .18s;
  }
  .field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(58,175,169,.15)}
  .hint{font-size:.74rem;color:#9ca3af;margin-top:4px}
  .btn{
    width:100%;padding:12px;border:none;border-radius:10px;
    background:linear-gradient(135deg,var(--bosque),var(--teal-d));color:#fff;
    font-size:.9rem;font-weight:700;font-family:'Poppins',sans-serif;
    cursor:pointer;margin-top:8px;transition:opacity .18s,transform .15s;
  }
  .btn:hover{opacity:.92;transform:translateY(-1px)}
  .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .msg{border-radius:8px;padding:10px 14px;font-size:.8rem;margin-bottom:16px;display:none}
  .msg-error{background:#fef2f2;border:1px solid #fecaca;color:#dc2626}
  .msg-ok{background:#f0fdf4;border:1px solid #86efac;color:#15803d}
  .skip{display:block;text-align:center;margin-top:18px;font-size:.78rem;color:#9ca3af;text-decoration:none}
  .skip:hover{color:#6b7280}
  .aviso-obligatorio{
    display:flex;align-items:center;gap:8px;
    background:#fffbeb;border:1px solid #fde68a;color:#92400e;
    border-radius:8px;padding:9px 12px;font-size:.76rem;margin-bottom:20px;
  }
</style>
</head>
<body>
<script src="/security.js"></script>

<div class="card">
  <img src="src/LogoSB.jpg" alt="Secretaría de Bosques — Gobierno del Chubut" style="height:44px;max-width:100%;width:auto;object-fit:contain;margin-bottom:18px;display:block" onerror="this.style.display='none'">
  <div class="icono"><i class="fa-solid fa-key"></i></div>
  <h1>Cambiar tu contraseña</h1>
  <p class="sub" id="subtexto">Por seguridad, elegí una contraseña nueva para tu acceso al Vivero LEMU.</p>

  <div class="aviso-obligatorio" id="avisoObligatorio" style="display:none">
    <i class="fa-solid fa-triangle-exclamation"></i>
    <span>Tu contraseña es provisoria. Tenés que cambiarla antes de continuar.</span>
  </div>

  <div class="msg msg-error" id="errBox"></div>
  <div class="msg msg-ok" id="okBox"></div>

  <form id="frm">
    <div class="field">
      <label>Contraseña actual</label>
      <input type="password" id="passActual" autocomplete="current-password" required/>
      <div class="hint" id="hintActual" style="display:none">Ingresá la contraseña provisoria entregada por un administrador autorizado.</div>
    </div>
    <div class="field">
      <label>Contraseña nueva</label>
      <input type="password" id="passNueva" autocomplete="new-password" minlength="12" required/>
      <div class="hint">Mínimo 12 caracteres.</div>
    </div>
    <div class="field">
      <label>Repetir contraseña nueva</label>
      <input type="password" id="passNueva2" autocomplete="new-password" minlength="12" required/>
    </div>
    <button type="submit" class="btn" id="btnGuardar">
      <i class="fa-solid fa-floppy-disk" style="margin-right:7px"></i>Guardar nueva contraseña
    </button>
  </form>

  <a href="index.html" class="skip" id="linkVolver">Volver al sistema</a>
</div>

<script>
(async()=>{
  // Confirmar sesión activa antes de mostrar el formulario
  try{
    const r = await fetch('/api/auth/me', { credentials:'include' });
    if(!r.ok){ location.replace('/login.html'); return; }
    const usuario = await r.json();
    window.setCsrfToken(usuario.csrf_token);
    if(usuario.debe_cambiar_clave){
      // Si el cambio es obligatorio, no se puede "volver" sin cambiarla primero
      document.getElementById('linkVolver').style.display='none';
      document.getElementById('avisoObligatorio').style.display='flex';
      document.getElementById('hintActual').style.display='block';
      document.getElementById('subtexto').textContent = 'Ingresá tu contraseña provisoria y elegí una nueva para continuar.';
    }
  }catch{
    location.replace('/login.html');
  }
})();

document.getElementById('frm').addEventListener('submit', async e=>{
  e.preventDefault();
  const errBox = document.getElementById('errBox');
  const okBox = document.getElementById('okBox');
  errBox.style.display='none'; okBox.style.display='none';

  const passActual = document.getElementById('passActual').value;
  const passNueva = document.getElementById('passNueva').value;
  const passNueva2 = document.getElementById('passNueva2').value;

  if(passNueva !== passNueva2){
    errBox.textContent = 'Las contraseñas nuevas no coinciden.';
    errBox.style.display='block';
    return;
  }
  if(passNueva.length < 12){
    errBox.textContent = 'La contraseña nueva debe tener al menos 12 caracteres.';
    errBox.style.display='block';
    return;
  }
  if(passNueva === passActual){
    errBox.textContent = 'La contraseña nueva debe ser distinta de la actual.';
    errBox.style.display='block';
    return;
  }

  const btn = document.getElementById('btnGuardar');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="margin-right:7px"></i>Guardando…';

  try{
    const r = await fetch('/api/auth/cambiar-password', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password_actual: passActual, password_nuevo: passNueva })
    });
    const d = await r.json();
    if(!r.ok){
      errBox.textContent = d.error || 'No se pudo cambiar la contraseña.';
      errBox.style.display='block';
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-floppy-disk" style="margin-right:7px"></i>Guardar nueva contraseña';
      return;
    }
    okBox.textContent = 'Contraseña actualizada correctamente. Redirigiendo…';
    okBox.style.display='block';
    setTimeout(()=>location.href='index.html', 1500);
  }catch{
    errBox.textContent = 'Error de conexión con el servidor.';
    errBox.style.display='block';
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-floppy-disk" style="margin-right:7px"></i>Guardar nueva contraseña';
  }
});
</script>
</body>
</html>
