<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gestión · Vivero LEMU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--green:#173f32;--teal:#35b8b0;--bg:#f3f6f5;--line:#dbe5e1;--text:#27352f;--muted:#68766f;--red:#c94a50;--amber:#bd7b16}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.top{background:var(--green);color:white;padding:14px 5%;display:flex;justify-content:space-between;align-items:center}.top a{color:white;text-decoration:none}.wrap{max-width:1240px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}.hero h1{margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap}button,input,select{font:inherit;border:1px solid var(--line);border-radius:7px;padding:9px 11px;background:white}button{cursor:pointer}.primary{background:var(--teal);border-color:var(--teal);color:white;font-weight:700}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:16px 0}.card,.box{background:white;border:1px solid var(--line);border-radius:11px;padding:16px}.card strong{display:block;font-size:24px;color:var(--green)}.card span{font-size:11px;color:var(--muted)}.box{margin:14px 0}.box h2{margin:0 0 12px;font-size:17px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}th{font-size:11px;color:var(--muted);text-transform:uppercase}.badge{display:inline-block;padding:4px 7px;border-radius:12px;font-size:10px;font-weight:700;background:#e7efec}.badge.ausente{background:#fde8e8;color:var(--red)}.badge.tarde,.badge.jornada_abierta{background:#fff1d8;color:var(--amber)}.badge.presente{background:#ddf6ea;color:#16734c}.form{display:grid;gap:9px}.days{display:flex;gap:5px;flex-wrap:wrap}.days label{border:1px solid var(--line);padding:6px;border-radius:7px;font-size:12px}.empty{padding:24px;text-align:center;color:var(--muted)}.report-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.report-item{background:#f7faf9;border-radius:8px;padding:12px}.report-item b{display:block;font-size:20px}.hidden{display:none!important}@media(max-width:850px){.wrap{padding:14px}.hero{align-items:start;flex-direction:column}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.report-grid{grid-template-columns:repeat(2,1fr)}table{display:block;overflow:auto}.top{padding:12px 14px}}
    body,button,input,select{font-family:'Poppins','Segoe UI',sans-serif}.hero h1,.box h2{font-family:'Hind','Segoe UI',sans-serif}
    #scheduleForm{font-size:12px}#scheduleForm>label{display:grid;gap:5px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.01em}#scheduleForm select,#scheduleForm input{font-size:12px;line-height:1.3;color:var(--text)}#scheduleForm select{font-weight:500}#scheduleForm .days label{font-size:11px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:4px;padding:6px 8px}#scheduleForm .controls label{font-size:11px;font-weight:600;color:var(--muted);display:grid;gap:4px}#scheduleForm button{font-size:12px;padding:9px 12px}.box h2{font-size:18px;line-height:1.2;font-weight:700;letter-spacing:.01em}
    .hero>.controls{align-items:center}.hero #fecha{height:40px;min-width:170px;padding:8px 11px;font-family:'Poppins','Segoe UI',sans-serif;font-size:12px;font-weight:500;color:var(--text)}.hero #actualizar{height:40px;padding:8px 16px;font-family:'Poppins','Segoe UI',sans-serif;font-size:12px;font-weight:600;letter-spacing:.01em;border-radius:7px}
    #month,#loadReport,#downloadReport{height:38px;font-family:'Poppins','Segoe UI',sans-serif;font-size:12px}#month{min-width:175px;font-weight:500;color:var(--text)}#loadReport,#downloadReport{padding:8px 13px;font-weight:600}.report-item b{font-family:'Hind','Segoe UI',sans-serif;font-size:21px;line-height:1.1}.report-item .muted{font-size:11px;line-height:1.35}
    #absenceForm{font-size:12px}#absenceForm>label{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px;font-weight:600}#absenceForm select,#absenceForm input{min-height:38px;font-family:'Poppins','Segoe UI',sans-serif;font-size:12px;color:var(--text)}#absenceForm>label input{width:68%;min-height:38px}#absenceForm button{min-height:38px;padding:8px 12px;font-family:'Poppins','Segoe UI',sans-serif;font-size:12px;font-weight:600}
    .top a{display:inline-flex;align-items:center;min-height:32px;padding:5px 8px;font-family:'Poppins','Segoe UI',sans-serif;font-size:12px;font-weight:500;line-height:1.2;letter-spacing:.01em}
  </style>
</head>
<body>
<script src="/security.js"></script>
<header class="top"><b>Vivero Provincial LEMU · Gestión</b><a href="/index.html">← Volver al inicio</a></header>
<main class="wrap">
  <section class="hero"><div><h1>Tablero de gestión</h1><div class="muted">Asistencia, calendario laboral, alertas productivas e informe mensual.</div></div><div class="controls"><input type="date" id="fecha"><button class="primary" id="actualizar">Actualizar</button></div></section>
  <section class="cards" id="summary"></section>
  <div class="grid">
    <section class="box"><h2>Asistencia del día</h2><div id="attendance"></div></section>
    <section class="box"><h2>Configurar horario</h2><form class="form" id="scheduleForm">
      <select id="scheduleUser" required><option value="">Seleccionar persona</option></select>
      <div class="days"><label><input type="checkbox" value="1"> Lu</label><label><input type="checkbox" value="2"> Ma</label><label><input type="checkbox" value="3"> Mi</label><label><input type="checkbox" value="4"> Ju</label><label><input type="checkbox" value="5"> Vi</label><label><input type="checkbox" value="6"> Sá</label><label><input type="checkbox" value="7"> Do</label></div>
      <div class="controls"><label>Entrada <input type="time" id="entry" value="08:00" required></label><label>Salida <input type="time" id="exit" value="16:00" required></label></div>
      <label>Tolerancia (minutos) <input type="number" id="tolerance" value="15" min="0" max="180"></label>
      <label>Vigente desde <input type="date" id="validFrom" required></label>
      <input id="scheduleReason" placeholder="Motivo del cambio (obligatorio)" minlength="5" required>
      <button class="primary">Guardar horario</button>
    </form></section>
  </div>
  <div class="grid">
    <section class="box"><h2>Informe mensual</h2><div class="controls"><input type="month" id="month"><button id="loadReport">Generar</button><button id="downloadReport">Descargar CSV</button></div><div id="report" style="margin-top:12px"></div></section>
    <section class="box"><h2>Registrar ausencia</h2><form class="form" id="absenceForm"><select id="absenceUser" required><option value="">Seleccionar persona</option></select><select id="absenceType"><option value="licencia">Licencia</option><option value="comision">Comisión</option><option value="vacaciones">Vacaciones</option><option value="enfermedad">Enfermedad</option><option value="dia_estudio">Día de estudio</option><option value="otro">Otro</option></select><label>Desde <input type="date" id="absenceFrom" required></label><label>Hasta <input type="date" id="absenceTo" required></label><input id="absenceNotes" placeholder="Observaciones"><input id="absenceReason" placeholder="Motivo del registro" minlength="5" required><button class="primary">Registrar ausencia</button></form></section>
  </div>
</main>
<script>
const $=id=>document.getElementById(id); let users=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
async function api(url,options){const r=await fetch(url,{credentials:'include',...(options||{})});if(r.status===401){location.href='/login.html';throw Error('Sesión vencida')}const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Error');return data}
async function init(){const me=await api('/api/auth/me');window.setCsrfToken(me.csrf_token);if(!['director_general','administrador_tecnico'].includes(me.rol)){location.href='/index.html';return}users=await api('/api/usuarios');const options=users.filter(u=>u.activo).map(u=>`<option value="${u.id}">${esc(u.nombre)}</option>`).join('');$('scheduleUser').insertAdjacentHTML('beforeend',options);$('absenceUser').insertAdjacentHTML('beforeend',options);$('fecha').value=today();$('validFrom').value=today();$('absenceFrom').value=today();$('absenceTo').value=today();$('month').value=today().slice(0,7);await loadAttendance();await loadReport()}
async function loadAttendance(){const d=await api('/api/gestion/asistencia?fecha='+$('fecha').value);const keys=[['presente','Presentes'],['tarde','Tardanzas'],['jornada_abierta','Sin salida'],['ausente','Ausentes'],['ausencia_justificada','Justificados'],['no_programado','No programados']];$('summary').innerHTML=keys.map(([k,l])=>`<div class="card"><strong>${d.resumen[k]||0}</strong><span>${l}</span></div>`).join('');$('attendance').innerHTML=d.personas.length?`<table><thead><tr><th>Persona</th><th>Horario</th><th>Entrada</th><th>Salida</th><th>Horas</th><th>Estado</th></tr></thead><tbody>${d.personas.map(p=>`<tr><td><b>${esc(p.nombre)}</b><br><span class="muted">${esc(p.rol)}</span></td><td>${p.hora_entrada_programada?esc(p.hora_entrada_programada.slice(0,5))+'–'+esc(p.hora_salida_programada.slice(0,5)):'—'}</td><td>${p.primera_entrada?new Date(p.primera_entrada).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):'—'}</td><td>${p.ultima_salida?new Date(p.ultima_salida).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):'—'}</td><td>${p.minutos_trabajados!=null?(p.minutos_trabajados/60).toFixed(1):'—'}</td><td><span class="badge ${esc(p.estado_asistencia)}">${esc(p.estado_asistencia.replaceAll('_',' '))}</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Sin personas activas</div>'}
async function loadReport(){const d=await api('/api/gestion/informe-mensual?mes='+$('month').value);const labels={asistencias:'Entradas registradas',tareas_total:'Tareas creadas',tareas_completadas:'Tareas completadas',plantas_stock:'Plantas en stock',lotes_activos:'Lotes activos',alertas_sanitarias:'Alertas sanitarias altas',plantas_despachadas:'Plantas despachadas',bajas_mes:'Bajas registradas',agua_litros_mes:'Agua aplicada (litros)',retencion_acumulada_pct:'Retención acumulada (%)',lotes_sin_muestreo_60d:'Lotes sin muestreo en 60 días'};$('report').innerHTML=`<div class="report-grid">${Object.entries(d.resumen).map(([k,v])=>`<div class="report-item"><b>${v??'Sin dato'}</b><span class="muted">${labels[k]||esc(k)}</span></div>`).join('')}</div>`}
$('actualizar').onclick=()=>loadAttendance().catch(e=>alert(e.message));$('loadReport').onclick=()=>loadReport().catch(e=>alert(e.message));$('downloadReport').onclick=()=>location.href='/api/gestion/informe-mensual.csv?mes='+$('month').value;
$('scheduleForm').onsubmit=async e=>{e.preventDefault();const dias=[...document.querySelectorAll('.days input:checked')].map(x=>Number(x.value));try{await api('/api/gestion/horarios/'+$('scheduleUser').value,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({dias,hora_entrada:$('entry').value,hora_salida:$('exit').value,tolerancia_min:Number($('tolerance').value),vigente_desde:$('validFrom').value,motivo:$('scheduleReason').value})});alert('Horario guardado');await loadAttendance()}catch(x){alert(x.message)}};
$('absenceForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/gestion/ausencias',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario_id:Number($('absenceUser').value),tipo:$('absenceType').value,fecha_desde:$('absenceFrom').value,fecha_hasta:$('absenceTo').value,observaciones:$('absenceNotes').value,motivo:$('absenceReason').value})});alert('Ausencia registrada');await loadAttendance()}catch(x){alert(x.message)}};
init().catch(e=>console.error(e));
</script>
</body></html>
