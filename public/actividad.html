<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Actividad de usuarios — Vivero LEMU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--forest:#173f34;--teal:#258f8b;--line:#dbe4e1;--muted:#65736f;--bg:#f5f7f6;--card:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:'Poppins','Segoe UI',sans-serif;color:#1e2c28}
    header{background:var(--forest);color:#fff;padding:15px 4%;display:flex;justify-content:space-between;gap:16px;align-items:center}
    header a{color:#fff;text-decoration:none}.wrap{width:min(1180px,94%);margin:24px auto}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
    h1,h2,header strong{font-family:'Hind','Segoe UI',sans-serif}h1,h2{margin:0 0 10px}.muted{color:var(--muted);font-size:13px}.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
    label{font-size:12px;font-weight:600;color:var(--muted)}select,button{font-family:'Poppins','Segoe UI',sans-serif;margin-top:5px;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}
    button{cursor:pointer;background:var(--teal);color:#fff;font-weight:600}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
    .person{border:1px solid var(--line);border-radius:10px;padding:12px}.person strong{display:block}.person small{color:var(--muted)}
    .feed{display:grid;gap:9px}.event{border-left:4px solid var(--teal);background:#f8fbfa;border-radius:8px;padding:11px 13px}
    .event-head{display:flex;justify-content:space-between;gap:12px}.event-title{font-weight:bold;font-size:13px}.event-time{font-size:11px;color:var(--muted);white-space:nowrap}
    .event-meta,.event-detail{font-size:12px;color:var(--muted);margin-top:4px}.empty{text-align:center;color:var(--muted);padding:25px}
    @media(max-width:650px){header{align-items:flex-start}.event-head{display:block}.event-time{display:block;margin-top:3px}.wrap{width:94%;margin-top:14px}}
  </style>
</head>
<body>
<script src="/security.js"></script>
<header><strong>Vivero LEMU · Actividad de usuarios</strong><a href="/index.html">← Volver</a></header>
<main class="wrap">
  <section class="card">
    <h1>Actividad del equipo</h1>
    <p class="muted">Accesos, fichajes, novedades, archivos y acciones administrativas registradas por el sistema.</p>
    <div class="controls">
      <label>Persona
        <select id="userFilter"><option value="">Todas las personas</option></select>
      </label>
      <button id="refreshButton" type="button">Actualizar</button>
    </div>
  </section>
  <section class="card">
    <h2>Estado de accesos</h2>
    <div class="summary" id="summary"><p class="empty">Cargando…</p></div>
  </section>
  <section class="card">
    <h2>Registro reciente</h2>
    <div class="feed" id="feed"><p class="empty">Cargando…</p></div>
  </section>
</main>
<script>
let currentUser=null;
const filter=document.getElementById('userFilter');
function esc(value){const d=document.createElement('div');d.textContent=value??'';return d.innerHTML}
function dateTime(value){return value?new Intl.DateTimeFormat('es-AR',{dateStyle:'short',timeStyle:'short'}).format(new Date(value)):'Sin registros'}
function actionLabel(value){return String(value||'ACTIVIDAD').replaceAll('_',' ').toLowerCase().replace(/^\w/,letter=>letter.toUpperCase())}
async function request(url){const response=await fetch(url,{credentials:'include'});const data=await response.json();if(!response.ok)throw new Error(data.error||'Operación rechazada');return data}
async function load(){
  const suffix=filter.value?`?usuario_id=${encodeURIComponent(filter.value)}`:'';
  const data=await request(`/api/usuarios/actividad${suffix}`);
  if(filter.options.length===1){
    data.usuarios.forEach(user=>filter.insertAdjacentHTML('beforeend',`<option value="${user.id}">${esc(user.nombre)} · ${esc(user.email)}</option>`));
  }
  const shownUsers=filter.value?data.usuarios.filter(user=>String(user.id)===filter.value):data.usuarios;
  document.getElementById('summary').innerHTML=shownUsers.map(user=>`<div class="person">
    <strong>${esc(user.nombre)}</strong><small>${esc(user.email)} · ${esc(user.rol)}</small>
    <div class="event-detail">${user.activo?'Activo':'Inactivo'} · Último acceso: ${esc(dateTime(user.ultimo_acceso))}</div>
    ${user.bloqueado_hasta?`<div class="event-detail">Bloqueado hasta ${esc(dateTime(user.bloqueado_hasta))}</div>`:''}
  </div>`).join('')||'<p class="empty">Sin personas para mostrar.</p>';
  document.getElementById('feed').innerHTML=data.eventos.map(event=>`<article class="event">
    <div class="event-head"><span class="event-title">${esc(actionLabel(event.accion))}</span><time class="event-time">${esc(dateTime(event.creado_en))}</time></div>
    <div class="event-meta">${esc(event.nombre||'Sistema')} · ${esc(event.email||'sin usuario')} · ${esc(event.entidad)}</div>
    ${event.motivo?`<div class="event-detail">${esc(event.motivo)}</div>`:''}
  </article>`).join('')||'<p class="empty">No hay actividad registrada para este filtro.</p>';
}
async function init(){
  const response=await fetch('/api/auth/me',{credentials:'include'});
  if(!response.ok){location.replace('/login.html');return}
  currentUser=await response.json();
  if(currentUser.rol!=='director_general'){location.replace('/index.html');return}
  await load();
}
filter.addEventListener('change',()=>load().catch(error=>alert(error.message)));
document.getElementById('refreshButton').addEventListener('click',()=>load().catch(error=>alert(error.message)));
init().catch(error=>{document.getElementById('feed').innerHTML=`<p class="empty">${esc(error.message)}</p>`});
</script>
</body>
</html>
